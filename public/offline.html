<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • Habit Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 18px;
      padding: 36px 28px;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px auto;
      border-radius: 16px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      font-size: 32px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: #3b82f6;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry-btn {
      background: #3b82f6;
      color: #ffffff;
      font-weight: 700;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .retry-btn:hover {
      background: #2563eb;
    }
    .note {
      font-size: 11px;
      color: #64748b;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon">⚡</div>
    <h1>HABIT TRACKER • OFFLINE</h1>
    <p>You appear to be offline right now. Your habits and changes are safely cached and will sync automatically once you reconnect.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
    <p class="note">Consistency is the key to progress.</p>
  </div>
</body>
</html>
